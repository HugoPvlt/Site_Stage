<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header><img src="../img/logo_Test.png" alt="logo de l'entreprise" class="logo"></header>
    
    <form class="form_connexion" action="client.html">
        <p>Identifiant</p>
        <input type="text" placeholder="identifiant" required>
        
        <div class="password-container">
            <p>Mot de passe</p>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="button" id="togglePassword" class="show-btn">Voir</button>
        </div>

        <button type="submit" class="connexion-btn">Connexion</button>
    </form>
    
    <footer></footer>

    <script src="../JS/connexion.js"></script>
</body>
</html>
