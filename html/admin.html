<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="page-admin">
    <header><img src="../img/logo_Test.png" alt="logo de l'entreprise" class="logo"></header>
    
    <div class="admin-container">
        <div class="admin-gauche">
            <form class="form_connexion">
                <p>Identifiant</p>
                <input type="text" placeholder="identifiant" id="id_admin"required>
                
                <div class="password-container">
                    <p>Mot de passe</p>
                    <input type="password" id="password" placeholder="Mot de passe" required>
                    <button type="button" id="togglePassword" class="show-btn">Voir</button>
                </div>

                <button type="submit" id="btn-ajouter-admin" class="connexion-btn">Ajouter</button>
            </form>
        </div>

        <div class="admin-droite">
            <input type="text" placeholder="recherche utilisateur" class="Recherche">
            <div class="form_tab_USER">
                <table id="tab_id_MDP" class="tab_USER" >
                    <tr>
                        <th>identifiant</th>
                        <th>Mot de passe</th>
                    </tr>
                    
                    
                </table>
                
                <p id="txt_base">Aucun utilisateur</p>
            </div>
        </div>
    </div>
    
    <footer></footer>
    <script src="../JS/admin.js"></script>
</body>
</html>
